# pybars3-rs: pybars3's template compiler in Rust (compiler/), and the
# extension module of the pybars3-rs Python package (native/).
[workspace]
resolver = "3"
members = ["compiler", "native"]
# The compiler is what `cargo test` and `cargo bench` exercise by default; the
# extension module links against libpython and is built with maturin.
default-members = ["compiler"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Edition 2024 needs Rust 1.85, and so does PyO3 0.30. CI checks this.
rust-version = "1.85"
repository = "https://github.com/wbond/pybars3"
homepage = "https://github.com/wbond/pybars3/tree/master/pybars3-rs"

[workspace.dependencies]
pybars3-compiler = { path = "compiler" }
pyo3 = { version = "0.30.1", default-features = false, features = ["macros"] }
# Dev-dependencies of the compiler.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1", default-features = false, features = ["std"] }
serde_json = "1"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# pybars' rules are long, and the port keeps one function per rule.
too_many_lines = "allow"
# The port mirrors pybars' names (`rule_*`, `add_*`); some repeat the module.
module_name_repetitions = "allow"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
# The extension module's few `unsafe` blocks each state why they are sound.
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"

[profile.release]
# Python wheels are built with this profile.
lto = "fat"
codegen-units = 1

[profile.bench]
inherits = "release"
debug = 1
