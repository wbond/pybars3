name: pybars3-rs release

# Builds the wheels and the source distribution of pybars3-rs on every change
# to its packaging and on a release tag, and tests the wheels as installed. A
# tag `pybars3-rs-vX.Y.Z` publishes them to PyPI, with trusted publishing:
# https://docs.pypi.org/trusted-publishers/ (the `pypi` environment).

on:
  push:
    tags: ["pybars3-rs-v*"]
  pull_request:
    branches:
      - master
    paths:
      - pybars3-rs/Cargo.toml
      - pybars3-rs/Cargo.lock
      - pybars3-rs/pyproject.toml
      - pybars3-rs/compiler/**
      - pybars3-rs/native/**
      - pybars3-rs/pybars_rs/**
      - .github/workflows/pybars3-rs-release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  wheels:
    name: Wheels (${{ matrix.platform.os }} ${{ matrix.platform.target }} ${{ matrix.platform.manylinux }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: linux, runner: ubuntu-latest, target: x86_64, manylinux: "2_17" }
          - { os: linux, runner: ubuntu-24.04-arm, target: aarch64, manylinux: "2_17" }
          - { os: linux, runner: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: linux, runner: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
          - { os: macos, runner: macos-15-intel, target: x86_64 }
          - { os: macos, runner: macos-latest, target: aarch64 }
          - { os: windows, runner: windows-latest, target: x64, python-arch: x64 }
          # CPython has no Windows arm64 build before 3.11; the wheel is still
          # cp310-abi3.
          - { os: windows, runner: windows-11-arm, target: aarch64, python-arch: arm64, build-python: "3.11" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.platform.os != 'linux'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.platform.build-python || '3.10' }}
          architecture: ${{ matrix.platform.python-arch }}
      # One abi3 wheel per platform serves CPython 3.10 and later.
      - name: Build the abi3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.16.0
          working-directory: pybars3-rs
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          args: --release --locked --compatibility pypi --out dist
      # Free-threaded CPython cannot load abi3 wheels.
      - if: matrix.platform.os != 'linux'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14t"
          architecture: ${{ matrix.platform.python-arch }}
      - name: Build the free-threaded wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.16.0
          working-directory: pybars3-rs
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          args: --release --locked --compatibility pypi --out dist -i python3.14t
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.platform.os }}-${{ matrix.platform.target }}-${{ matrix.platform.manylinux || 'native' }}
          path: pybars3-rs/dist

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.16.0
          working-directory: pybars3-rs
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: pybars3-rs/dist

  test-wheels:
    name: Installed wheel, Python ${{ matrix.python }} (${{ matrix.os }})
    needs: wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10", wheels: wheels-linux-x86_64-2_17 }
          - { os: ubuntu-latest, python: "3.15", wheels: wheels-linux-x86_64-2_17 }
          - { os: ubuntu-latest, python: "3.14t", wheels: wheels-linux-x86_64-2_17 }
          - { os: ubuntu-24.04-arm, python: "3.12", wheels: wheels-linux-aarch64-2_17 }
          - { os: macos-latest, python: "3.13", wheels: wheels-macos-aarch64-native }
          - { os: windows-latest, python: "3.14", wheels: wheels-windows-x64-native }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.wheels }}
          path: dist
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the wheel
        run: |
          python -m pip install -r pybars3-rs/ci/requirements-02-hypothesis.txt .
          python -m pip install --no-index --find-links dist --no-deps pybars3-rs
      # From a copy of the tests, so that they import the installed wheel and
      # not the sources in pybars3-rs/.
      - name: Test the wheel
        run: |
          mkdir "$RUNNER_TEMP/wheel-tests"
          cp -r pybars3-rs/tests pybars3-rs/tests.py "$RUNNER_TEMP/wheel-tests/"
          cd "$RUNNER_TEMP/wheel-tests"
          PYBARS_TESTS="$GITHUB_WORKSPACE/tests" python tests.py

  publish:
    name: Publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/pybars3-rs-v')
    needs: [wheels, sdist, test-wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing to PyPI
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
