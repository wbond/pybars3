name: pybars3-rs

# pybars3-rs reproduces the pybars of this repository, so it is tested on
# every change, not only on changes to pybars3-rs/.
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

defaults:
  run:
    working-directory: pybars3-rs

jobs:
  rust-lint:
    name: Rust lint (fmt, clippy, docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: pybars3-rs
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: The fuzz target builds
        run: cargo check --manifest-path fuzz/Cargo.toml --locked

  rust-test:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: pybars3-rs
      - run: cargo test --all-targets --locked
      - run: cargo test --doc --locked
      - name: The benchmarks run
        run: cargo bench --locked -- --test

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    env:
      # Keep in sync with rust-version in Cargo.toml. rust-toolchain.toml says
      # stable, and this overrides it.
      RUSTUP_TOOLCHAIN: "1.85"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: pybars3-rs
      # The libraries; tests and benchmarks may use newer dependencies.
      - run: cargo check --workspace --locked

  tables:
    name: Generated tables are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Asks CPython 3.10 to 3.15, which uv installs, for their character classes.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: python3 tools/gen_tables.py --check

  golden:
    name: Golden corpus matches pybars ${{ matrix.pybars }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pybars: [repository, "0.9.6"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The corpus is recorded on CPython 3.12 (Unicode 15.0.0).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: pybars3-rs
      - name: Install dependencies
        run: python -m pip install -r ./ci/requirements-01-maturin.txt -r ./ci/requirements-02-hypothesis.txt
      - name: Install pybars3
        shell: bash
        env:
          PYBARS: ${{ matrix.pybars }}
        run: bash ci/install-pybars3.sh "$PYBARS"
      - name: Build pybars3-rs
        run: python -m pip install --no-build-isolation --no-deps -e .
      # Re-derives every expected result of compiler/tests/golden.rs from
      # pybars itself, so that the Rust-only tests cannot drift from pybars.
      - run: python tools/gen_golden.py --check

  coverage-compiler:
    name: Coverage of the compiler's tests (cargo-llvm-cov)
    runs-on: ubuntu-latest
    env:
      # Branch coverage needs nightly; rust-toolchain.toml says stable.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: llvm-tools-preview
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-llvm-cov
      - run: |
          cargo llvm-cov --package pybars3-compiler --all-targets --branch --locked \
            --json --summary-only --output-path compiler-coverage.json
          python3 tools/check_coverage.py compiler-coverage.json --branches 95 --lines 98 --regions 97

  coverage-python:
    name: Coverage of the Python tests (cargo-llvm-cov)
    runs-on: ubuntu-latest
    env:
      # Branch coverage needs nightly; rust-toolchain.toml says stable.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: llvm-tools-preview
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-llvm-cov
      # The extension module's code differs between CPython 3.10/3.11 and
      # 3.12+, and the compiler's between pybars3 0.9.6 and 0.9.7, so the
      # Python tests run on each, into one report.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: |
            3.11
            3.12
      - name: The Python tests, on CPython 3.11 and 3.12, with pybars 0.9.7 and 0.9.6
        run: |
          eval "$(cargo llvm-cov show-env --branch --sh)"
          for run in 3.11:.. 3.12:.. 3.12:pybars3==0.9.6; do
            python="${run%%:*}"
            pybars="${run#*:}"
            environment="$RUNNER_TEMP/venv-$python-${pybars#pybars3==}"
            "python$python" -m venv "$environment"
            "$environment/bin/python" -m pip install -r ./ci/requirements-01-maturin.txt -r ./ci/requirements-02-hypothesis.txt "$pybars"
            VIRTUAL_ENV="$environment" "$environment/bin/maturin" develop --release --locked --skip-install
            if [ "$pybars" = .. ]; then
              "$environment/bin/python" tests.py
            else
              PYBARS_TESTS="$(sh ci/pybars3-tests.sh 0.9.6)" "$environment/bin/python" tests.py
            fi
          done
          cargo llvm-cov report --release --branch --json --summary-only --output-path python-coverage.json
          python3 tools/check_coverage.py python-coverage.json --branches 90 --lines 95

  python-lint:
    name: Python lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install flake8
        run: python -m pip install -r ./ci/requirements-03-flake8.txt
      - run: python -m flake8

  python-test:
    name: Python ${{ matrix.python }} (${{ matrix.os }}), pybars ${{ matrix.pybars }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "3.14t"]
        pybars: [repository]
        include:
          - { os: macos-latest, python: "3.12", pybars: repository }
          - { os: windows-latest, python: "3.12", pybars: repository }
          # The other release pybars3-rs reproduces, on both ways CPython
          # counts recursion.
          - { os: ubuntu-latest, python: "3.10", pybars: "0.9.6" }
          - { os: ubuntu-latest, python: "3.12", pybars: "0.9.6" }
    env:
      # Every template of up to 3 characters over the character classes.
      EXHAUSTIVE_MAX_LENGTH: "3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: pybars3-rs
      - name: Install dependencies
        run: python -m pip install -r ./ci/requirements-01-maturin.txt -r ./ci/requirements-02-hypothesis.txt
      - name: Install pybars3
        shell: bash
        env:
          PYBARS: ${{ matrix.pybars }}
        run: bash ci/install-pybars3.sh "$PYBARS"
      - name: Build pybars3-rs
        run: python -m pip install --no-build-isolation --no-deps -e .
      - name: Run tests
        run: python tests.py

  workflows:
    name: Workflow lint (actionlint, zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - working-directory: .
        run: |
          uvx --from actionlint-py==1.7.12.25 actionlint .github/workflows/pybars3-rs*.yml
          uvx zizmor==1.32.0 --offline --persona=auditor --min-severity=low .github/workflows/pybars3-rs*.yml

  # The one check to require in branch protection: it fails unless every job
  # above passed, parity on every CPython included.
  ci-ok:
    name: pybars3-rs CI ok
    if: always()
    needs:
      - rust-lint
      - rust-test
      - msrv
      - tables
      - golden
      - coverage-compiler
      - coverage-python
      - python-lint
      - python-test
      - workflows
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        working-directory: .
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
